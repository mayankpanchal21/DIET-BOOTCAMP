<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3</title>
    <style>
        
        *{
            margin: 0;
        }
        /*div - selector */
        div{
            /* width - property 
            100% -value */
            width: 100%;
            height: 100vh;
        }
        h1{
            padding: 15px;
            color: yellow;
        }
        p{
                padding-left: 15px;
        }
    </style>
</head>
<body>
    <div style="background-color: red;">
        <h1>Hello, CSS!</h1>
        <p>This page is styled by the code on the left.</p>
    </div>
</body>
</html>


<!-- 
types of selectors:
1. Universal selector (*)
2. Element selector (div, h1, p)
3. id selector (#id)
4. class selector (.class)
5. child selector
6. group selector (div, h1, p)
