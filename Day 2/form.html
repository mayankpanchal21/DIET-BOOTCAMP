<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <Form >
        <div>
            Name: <input type="text" name="name" placeholder="Enter your name"> 
        </div>
        <div>
            Email: <input type="email" name="email" placeholder="Enter your email">
        </div>
        <div>
            Password: <input type="password" name="password" placeholder="Enter your password">
        </div>
        <div>
            <input type="text" name="message" id="" placeholder="Enter your message">
        </div>
        <div>
            <input type="date" name="" id="">
        </div>
        <div>
            Feedback: <br><textarea name="message" id="" cols="30" rows="10" placeholder="Enter your message"></textarea>
        </div>
        <div>
            Gender: <br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </div>
        <div>
            select your country: <br>
            <select name="country" id="">
                <option  value="#" selected>-----</option>
                <option  value="india">India</option>
                <option value="usa">USA</option>
                <option  value="uk">UK</option>
                <option value="canada">Canada</option>
        </div>
        <div>
            <input type="submit" value="Submit">
        </div>
    </Form> 
</body>
</html>
